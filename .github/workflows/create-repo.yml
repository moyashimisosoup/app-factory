name: App Factory private repository creation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: app-factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create:
    # Public intake! Only generic, public-safe Issue text is allowed.
    # Only the named owner can file/approve the request. Output never prints destination URL.
    if: >-
      github.repository == 'moyashimisosoup/app-factory' &&
      github.event.label.name == 'factory-approved' &&
      github.actor == 'moyashimisosoup' &&
      github.event.sender.login == 'moyashimisosoup' &&
      github.event.issue.user.login == 'moyashimisosoup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight offline safety tests (no secret required)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate adopted issue and create PRIVATE repository
        id: factory
        env:
          APP_FACTORY_ISSUE_BODY: ${{ github.event.issue.body }}
          APP_FACTORY_ISSUE_TOKEN: ${{ github.token }}
          APP_FACTORY_REPO_CREATOR: ${{ secrets.APP_FACTORY_REPO_CREATOR }}
        run: python3 scripts/create_repo.py --issue "${{ github.event.issue.number }}" --execute

      - name: Record confirmed result on private issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATUS: ${{ steps.factory.outputs.status }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$RESULT_STATUS" = "created" ]; then
            note="A PRIVATE repository was created successfully."
          else
            note="The previously-created PRIVATE repository was confirmed (safe retry)."
          fi
          note="$note"
\n\n'"The destination URL is intentionally not published in this public Issue or public Actions logs. To initialize the repository, find it in your authenticated GitHub repositories and verify its visibility, then add the starter files and register a public-safe entry in Session Deck. No web page was published."
          gh issue comment "$ISSUE_NUMBER" --body "$note"
