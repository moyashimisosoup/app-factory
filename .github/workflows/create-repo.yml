name: App Factory repository creation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: app-factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create:
    # Public intake! Only generic, public-safe Issue text is allowed.
    # Only the named owner can file/approve the request. Output never prints destination URL.
    if: >-
      github.repository == 'moyashimisosoup/app-factory' &&
      github.event.label.name == 'factory-approved' &&
      github.actor == 'moyashimisosoup' &&
      github.event.sender.login == 'moyashimisosoup' &&
      github.event.issue.user.login == 'moyashimisosoup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight offline safety tests (no secret required)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate adopted issue and create requested repository
        id: factory
        env:
          APP_FACTORY_ISSUE_BODY: ${{ github.event.issue.body }}
          APP_FACTORY_ISSUE_TOKEN: ${{ github.token }}
          APP_FACTORY_REPO_CREATOR: ${{ secrets.APP_FACTORY_REPO_CREATOR }}
        run: python3 scripts/create_repo.py --issue "${{ github.event.issue.number }}" --execute

      - name: Record confirmed result on public issue (URL redacted)
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATUS: ${{ steps.factory.outputs.status }}
          RESULT_VISIBILITY: ${{ steps.factory.outputs.visibility }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          case "$RESULT_VISIBILITY" in
            public) kind="PUBLIC" ;;
            private) kind="PRIVATE" ;;
            *) echo "Unrecognized destination visibility"; exit 1 ;;
          esac
          if [ "$RESULT_STATUS" = "created" ]; then
            note="A $kind repository was created successfully."
          elif [ "$RESULT_STATUS" = "already-created" ]; then
            note="The previously-created $kind repository was confirmed (safe retry)."
          else
            echo "Unrecognized result"; exit 1
          fi
          note="$note"$'\n\n'"The destination URL is intentionally not published in this public Issue or public Actions logs. To initialize the repository, find it in your authenticated GitHub repositories and verify its visibility, then add the starter files and register a public-safe entry in Session Deck. No web page was published."
          gh issue comment "$ISSUE_NUMBER" --body "$note"
